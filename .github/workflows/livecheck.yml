name: Homebrew Livecheck

on:
  schedule:
  - cron: 0 0 * * *
  workflow_dispatch:

jobs:
  livecheck:
    runs-on: macos-latest
    
    steps: 
    - name: Checkout Repo
      uses: actions/checkout@v7

    - name: Update Homebrew Formula
      uses: kitschpatrol/github-action-homebrew-bump-formula@v8
      with:
        token: ${{ secrets.HOMEBREW_TOKEN }}
        tap: nepherte/roon
        livecheck: true

    - name: Bump Homebrew Casks
      uses: kitschpatrol/github-action-homebrew-bump-cask@v3.8.9
      with:
        token: ${{ secrets.HOMEBREW_TOKEN }}
        tap: nepherte/ffmpeg
        livecheck: true
