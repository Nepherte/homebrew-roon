name: Homebrew Livecheck

on:
  schedule:
  - cron: 0 0 * * *
  workflow_dispatch:

jobs:
  livecheck:
    runs-on: macos-latest

    steps:
    - name: Checkout Repo
      uses: actions/checkout@v7

    - name: Trust Homebrew Taps
      run: brew trust nepherte/roon

    - name: Bump Homebrew Formula
      uses: dawidd6/action-homebrew-bump-formula@v11
      with:
        token: ${{ secrets.HOMEBREW_TOKEN }}
        tap: nepherte/roon
        livecheck: true

    - name: Bump Homebrew Casks
      uses: friesi23/action-homebrew-bump-cask@v2.2
      with:
        token: ${{ secrets.HOMEBREW_TOKEN }}
        tap: nepherte/roon
        livecheck: true
